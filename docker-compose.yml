services:
  web:
    container_name: ikusanon-boostday-form-web
    build: .
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
    expose:
      - "3000"
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - webdb_network
      - proxy_network
      - webbot_network

  # One-shot job: applies Prisma migrations before the web container starts.
  migrate:
    container_name: ikusanon-boostday-form-migrate
    build:
      context: .
      target: migrate
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      # webdb_network is internal; proxy_network keeps hosted databases reachable.
      - webdb_network
      - proxy_network
    restart: "no"

  nginx:
    container_name: ikusanon-boostday-form-nginx
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "83:80"
    restart: unless-stopped
    depends_on:
      - web
    networks:
      - proxy_network

  postgres:
    container_name: ikusanon-boostday-form-postgres
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ikusanon_boostday_form}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    expose:
      - "5432"
    networks:
      - webdb_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ikusanon_boostday_form} -h localhost",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  webdb_network:
    driver: bridge
    internal: true
  proxy_network:
    driver: bridge
  webbot_network:
    external: true
